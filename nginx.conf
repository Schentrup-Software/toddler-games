server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The whole site is a handful of small files served over a LAN, so always
    # revalidate: an update shows up on the tablet's next load, never stale JS.
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Build and run on any Docker host:
#
#   docker compose up --build -d      ->  http://localhost:30678
#
# For TrueNAS, paste one of the snippets from the README into
# Apps > Discover Apps > Custom App > Install via YAML instead.

services:
  toddler-games:
    build: .
    image: ghcr.io/schentrup-software/toddler-games:latest
    ports:
      - "30678:8080" # host:container - change the left side if 30678 is taken
    restart: unless-stopped
